name: Publish download page
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-download-site.mjs'
      - '.github/workflows/download-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: download-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Package website and verify downloads
        run: node scripts/build-download-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@v4
